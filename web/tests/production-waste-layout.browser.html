<!doctype html><html lang="es" data-theme="ice"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Captura de desperdicio</title>
<link rel="stylesheet" href="../public/styles.css"><link rel="stylesheet" href="../public/production.css"><link rel="stylesheet" href="../public/premium.css"><div id="app"></div><p id="qa-status" style="position:fixed;bottom:0;left:0;background:#112;color:white;z-index:5000"></p>
<script type="module">
import {createProductionStudio} from '../public/production-studio.js';
import {defaultCatalog,catalogKey} from '../public/plant-catalog.js';
import {createProductionReport,productionDraftKey} from '../public/production-model.js';
import {createProductionImages} from '../public/production-pdf.js';
const context={teamId:'prueba',teamName:'Equipo ficticio',plantId:'sacos',date:'2026-11-09'},catalog=defaultCatalog('sacos'),report=createProductionReport(catalog,context);
for(const row of Object.values(report.rows))row.active=false;
Object.assign(report.rows.extrusion,{target:'10,000',actual:'9,500',wasteTarget:'0.75',wasteActual:'0.25'});
const data=new Map([[catalogKey('sacos'),JSON.stringify(catalog)],[productionDraftKey(context.teamId),JSON.stringify(report)]]);
let shared,sharedMessage,downloaded;const studio=createProductionStudio(()=>({storage:{getText:async key=>data.get(key)??null,putText:async(key,value)=>data.set(key,value)},onPrepareImages:createProductionImages,onShareImages:async(images,report,message)=>{shared=images;sharedMessage=message;return 'Selector simulado';},onDownloadImages:async images=>{downloaded=images;return 'Descargas simuladas';},messageForReport:()=> 'Buenas noches, reporte de prueba.'}));

const root=document.getElementById('production-studio');[...root.querySelectorAll('button')].find(b=>b.textContent==='Eficiencias').click();
const card=root.querySelector('[data-row-id="extrusion"].prod-efficiency-card'),fields=[...card.querySelectorAll('.prod-efficiency-capture input')],set=(element,value)=>{element.value=value;element.dispatchEvent(new Event('input',{bubbles:true}));};
try{
 if(fields.length!==2||fields[0].value!=='10,000'||fields[1].value!=='9,500')throw Error('No se conservó la captura de producción');
 if(!card.querySelector('.prod-efficiency-result').textContent.includes('95'))throw Error('Eficiencia incorrecta');
 set(fields[1],'10,504.4');if(!card.querySelector('.prod-efficiency-result').textContent.includes('105,04')&&!card.querySelector('.prod-efficiency-result').textContent.includes('105.04'))throw Error('No reconoce comas de miles');
 const mode=card.querySelector('.prod-waste-capture select');mode.value='calculated';mode.dispatchEvent(new Event('change',{bubbles:true}));const quantities=card.querySelectorAll('.prod-waste-capture .prod-two-fields input');set(quantities[0],'1,000');set(quantities[1],'25');if(!card.querySelector('.prod-waste-result').textContent.includes('2,5')&&!card.querySelector('.prod-waste-result').textContent.includes('2.5'))throw Error('Cálculo de desperdicio incorrecto');
 mode.value='direct';mode.dispatchEvent(new Event('change',{bubbles:true}));if(card.querySelector('.prod-waste-capture input').value!=='0.25')throw Error('Se perdió el porcentaje directo');
 if(root.querySelector('.prod-totals'))throw Error('La barra de totales sigue visible');
 if(!card.textContent.includes('Libras de producción')||!card.textContent.includes('Libras de desperdicio'))throw Error('Etiquetas de Sysprod incorrectas');
 if(innerWidth>=1000){const cells=[card.querySelector('.prod-process-head'),fields[0],fields[1],card.querySelector('.prod-result-wrap'),card.querySelector('.prod-waste-target'),card.querySelector('.prod-waste-capture')].map(e=>e.getBoundingClientRect());for(let i=1;i<cells.length;i++)if(cells[i].left<cells[i-1].right-1)throw Error('Las columnas se superponen');}
 [...root.querySelectorAll('button')].find(b=>b.textContent==='Compartir imágenes').click();await new Promise(resolve=>setTimeout(resolve,400));const dialog=root.querySelector('.prod-images-dialog');if(!dialog.open)throw Error('No aparece el diálogo');const buttons=[...dialog.querySelectorAll('.prod-share-all button')];if(buttons.map(b=>b.textContent).join('|')!=='Vista previa|Descargar|Enviar')throw Error('Las acciones no coinciden');buttons[0].click();const preview=root.querySelector('.prod-image-preview-dialog');if(!preview.open||!preview.querySelector('img').src.startsWith('data:image/png'))throw Error('Vista previa no disponible');preview.style.maxHeight='400px';await preview.querySelector('img').decode();const nav=preview.querySelector('.prod-preview-navigation'),navRect=nav.getBoundingClientRect(),dialogRect=preview.getBoundingClientRect();if(navRect.top<dialogRect.top||navRect.bottom>dialogRect.bottom)throw Error('La navegación queda fuera de la ventana visible');preview.scrollTop=preview.scrollHeight;const scrolledNav=nav.getBoundingClientRect();if(scrolledNav.top<dialogRect.top||scrolledNav.bottom>dialogRect.bottom)throw Error('La navegación desaparece al desplazar');const first=preview.querySelector('img').src;[...preview.querySelectorAll('button')].find(b=>b.textContent==='Siguiente').click();if(preview.querySelector('img').src===first||!preview.querySelector('h2').textContent.includes('Estatus'))throw Error('La siguiente imagen no cambió');[...preview.querySelectorAll('button')].find(b=>b.textContent==='Anterior').click();if(preview.querySelector('img').src!==first)throw Error('No se pudo volver a la primera imagen');preview.querySelector('button').click();const text=dialog.querySelector('#prod-image-message');text.value='Mensaje personalizado de prueba';buttons[1].click();await new Promise(resolve=>setTimeout(resolve,20));if(downloaded?.length!==2||downloaded[0]===downloaded[1])throw Error('Las imágenes no son separadas');buttons[2].click();await new Promise(resolve=>setTimeout(resolve,20));if(shared?.length!==2||shared[0].dataUrl===shared[1].dataUrl||sharedMessage!=='Mensaje personalizado de prueba')throw Error('No se compartieron ambas imágenes y el mensaje editado');
 document.documentElement.dataset.qa='pass';document.getElementById('qa-status').textContent='PASS · captura e imágenes';
}catch(error){document.documentElement.dataset.qa='fail';document.getElementById('qa-status').textContent='FAIL · '+error.message;}
</script></html>
