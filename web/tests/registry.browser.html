<!doctype html><html lang="es" data-theme="halloween"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Catálogo central · prueba aislada</title><link rel="stylesheet" href="../public/styles.css"><link rel="stylesheet" href="../public/premium.css"><style>body{min-height:100vh}.registry-test-shell{position:relative;z-index:1;max-width:700px;margin:auto;padding:24px 16px 70px}#registry-test-status{position:fixed;bottom:0;left:0;right:0;z-index:9000;padding:8px;background:#10251c;color:#fff;font:12px system-ui}#registry-test-status[data-result=fail]{background:#652323}</style><main class="registry-test-shell"><div id="registry-test-host"></div></main><aside id="registry-test-status" role="status">Preparando prueba…</aside>
<script type="module">
import {createRegistryAdmin} from '../public/registry-admin.js';
import {CloudClient} from '../public/cloud-client.js';
const params=new URLSearchParams(location.search);if(params.has('theme'))document.documentElement.dataset.theme=params.get('theme');if(params.has('largeText'))document.documentElement.style.fontSize='200%';
const processId='b1000000-0000-4000-8000-000000000001',resourceId='b2000000-0000-4000-8000-000000000001';
const initial={version:1,plantId:'sacos',revision:1,processes:[{id:processId,code:'fixture',name:'Proceso de ejemplo',flow:'entry',cycle:'permanent',defaultKind:'machine',enabled:true,ordinal:1,resources:[{id:resourceId,name:'Máquina de ejemplo',kind:'machine',enabled:true,ordinal:1}]}]};
let value=structuredClone(initial),failure=null,admin=true,saves=0;const requests=[];
const backend={access:async()=>({admin}),registry:async plant=>plant==='sacos'?structuredClone(value):{version:1,plantId:plant,revision:0,processes:[]},saveRegistryProcess:async draft=>{requests.push(structuredClone(draft));if(failure)throw failure;saves++;if(draft.create)value.processes.push({...draft,code:draft.id,ordinal:value.processes.length+1,resources:[]});else Object.assign(value.processes.find(p=>p.id===draft.id),draft);value.revision++;return structuredClone(value);},saveRegistryResource:async draft=>{requests.push(structuredClone(draft));if(failure)throw failure;saves++;const process=value.processes.find(p=>p.id===draft.processId);if(draft.create)process.resources.push({...draft,ordinal:process.resources.length+1});else Object.assign(process.resources.find(r=>r.id===draft.id),draft);value.revision++;return structuredClone(value);}};
const transport=new CloudClient({},{fetcher:async(url,options)=>{const b=JSON.parse(options.body);assert(Number.isInteger(b.p_expected)&&b.p_expected===value.revision,'Revisión RPC ausente o equivocada');assert(options.headers.Authorization==='Bearer fixture-token','Solicitud sin autorización');if(failure?.code==='conflict')return new Response(JSON.stringify({code:'40001'}),{status:400});const draft={plantId:b.p_plant,revision:b.p_expected,id:b.p_id,create:b.p_create,name:b.p_name,flow:b.p_flow,cycle:b.p_cycle,defaultKind:b.p_default_kind,enabled:b.p_enabled,kind:b.p_kind,processId:b.p_process};const saved=await(url.endsWith('mn1_save_registry_resource')?backend.saveRegistryResource(draft):backend.saveRegistryProcess(draft));return new Response(JSON.stringify(saved));}});transport.token=async()=>'fixture-token';
const client={access:backend.access,registry:backend.registry,saveRegistryProcess:draft=>transport.saveRegistryProcess(draft),saveRegistryResource:draft=>transport.saveRegistryResource(draft)};
const host=document.getElementById('registry-test-host'),status=document.getElementById('registry-test-status'),controller=createRegistryAdmin(host,{client});
const assert=(ok,text)=>{if(!ok)throw Error(text);};const wait=async fn=>{const end=Date.now()+2500;while(!fn()){if(Date.now()>end)throw Error('Tiempo agotado');await new Promise(resolve=>setTimeout(resolve,10));}};
const clickText=text=>{const node=[...document.querySelectorAll('button')].find(n=>n.textContent===text);assert(node,'Falta '+text);node.click();};const form=()=>document.querySelector('.registry-form');const set=(name,text)=>{form().elements[name].value=text;form().elements[name].dispatchEvent(new Event('input',{bubbles:true}));};
try{
 await controller.open();assert(host.textContent.includes('Proceso de ejemplo'),'No cargó el catálogo');assert(!host.querySelector('details').open,'Proceso abierto por defecto');
 host.querySelector('summary').click();clickText('Editar proceso');set('name','Proceso renombrado');form().requestSubmit();await wait(()=>!document.querySelector('.registry-editor'));assert(value.processes[0].id===processId&&value.processes[0].name==='Proceso renombrado','Cambió identidad');
 host.querySelector('summary').click();clickText('+ Máquina o estación');set('name','Estación de prueba');set('kind','station');failure=Object.assign(Error('Fallo simulado de conexión'),{code:'offline'});form().requestSubmit();await wait(()=>form()?.textContent.includes('Sin conexión'));const attemptedId=requests.at(-1).id;assert(form().elements.name.value==='Estación de prueba','Se perdió el borrador');failure=null;form().requestSubmit();await wait(()=>!document.querySelector('.registry-editor'));assert(requests.at(-1).id===attemptedId,'Reintento duplicó ID');assert(value.processes[0].resources.length===2,'Recurso no agregado');
 host.querySelector('summary').click();clickText('Editar proceso');set('name','No sobrescribir');failure=Object.assign(Error('Conflicto'),{code:'conflict'});form().requestSubmit();await wait(()=>form()?.textContent.includes('otra sesión'));assert(form().elements.name.value==='No sobrescribir','Conflicto borró el formulario');controller.clear();assert(!document.querySelector('.registry-editor')&&!host.textContent.includes('Proceso renombrado'),'Logout no limpió datos privados');failure=null;
 admin=false;await controller.open();assert(!host.textContent.includes('Proceso renombrado')&&host.textContent.includes('Inicia sesión'),'Acceso no autorizado');
 admin=true;value=structuredClone(initial);await controller.open();const plant=host.querySelector('[data-registry=plant]');plant.value='polietileno';plant.dispatchEvent(new Event('change'));await wait(()=>host.textContent.includes('No hay procesos'));assert(!host.textContent.includes('Proceso de ejemplo'),'Mezcló plantas');plant.value='sacos';plant.dispatchEvent(new Event('change'));await wait(()=>host.textContent.includes('Proceso de ejemplo'));
 const before=saves;host.querySelector('[data-flow=exit]').click();assert(!host.textContent.includes('Proceso de ejemplo'),'Filtro salida falló');host.querySelector('[data-flow=entry]').click();assert(saves===before,'Filtro escribió datos');
 if(params.has('editor'))host.querySelector('[data-registry=add]').click();
 status.dataset.result='pass';status.textContent='OK · edición, IDs, reintento, conflicto, permisos y plantas';
}catch(error){status.dataset.result='fail';status.textContent='FALLO · '+error.message;console.error(error);}
</script></html>
