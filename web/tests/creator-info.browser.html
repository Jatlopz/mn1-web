<!doctype html><html lang="es" data-theme="ice"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Perfil del creador · prueba aislada</title><link rel="stylesheet" href="../public/styles.css"><link rel="stylesheet" href="../public/premium.css"><style>body{min-height:100vh}#result{position:fixed;bottom:0;left:0;padding:8px;z-index:9000;background:#153426;color:white;font:12px system-ui}#result[data-failed=true]{background:#632323}</style><p id="result">Ejecutando…</p>
<script type="module">
import {installCreatorInfo,normalizeCreatorInfo,publicCreatorInfo} from '../public/creator-info.js';
const $=id=>document.getElementById(id),assert=(v,m)=>{if(!v)throw Error(m)},wait=async fn=>{for(let i=0;i<250;i++){if(fn())return;await new Promise(r=>setTimeout(r,10));}throw Error('Tiempo agotado');};
const parsed=new DOMParser().parseFromString(await(await fetch('../public/index.html')).text(),'text/html');const about=parsed.getElementById('about-dialog');for(const img of about.querySelectorAll('img[src^="./"]'))img.src='../public/'+img.getAttribute('src').slice(2);document.body.append(about);$('close-about').addEventListener('click',()=>about.close());
let row={revision:0,info:{showCeo:true,showCoffee:true,showContact:true,contacts:[{kind:'email',value:'support@fixture.invalid'},{kind:'whatsapp',value:'+504 9999-0000'}]}},fail=false,conflict=false,passed=0,failed=0;
const values=new Map(),storage={getText:async k=>values.get(k)||null,putText:async(k,v)=>values.set(k,v)};
const client={creatorInfo:async()=>({revision:row.revision,info:publicCreatorInfo(row.info)}),creatorSettings:async()=>structuredClone(row),setCreatorInfo:async(expected,info)=>{if(fail)throw Object.assign(Error('La nube está restringida por su límite de uso. Tu borrador se conserva.'),{code:'402'});if(conflict||expected!==row.revision)throw Object.assign(Error('Conflicto'),{code:'conflict'});row={revision:expected+1,info:normalizeCreatorInfo(info)};return row.revision;}};
const api=installCreatorInfo({getServices:()=>({storage}),client,clipboard:{writeText:async()=>{}}});await api.ready;about.showModal();const editor=$('creator-info-editor'),form=$('creator-info-form');
async function check(name,fn){try{await fn();passed++;console.log('PASS '+name);}catch(e){failed++;console.error('FAIL '+name+': '+e.message);}}
const save=async()=>{form.requestSubmit();await wait(()=>$('creator-info-status').textContent!=='Guardando perfil…');};
await check('usuario normal sin controles; contacto público recibido',async()=>{assert(editor.hidden,'Editor público');assert($('creator-contact-list').textContent.includes('support@fixture.invalid'),'Contacto no recibido');});
await check('admin abre su perfil y puede ocultar CEO y coffee',async()=>{api.setAdmin(true);editor.open=true;await wait(()=>!form.querySelector('[type=submit]').disabled&&$('creator-info-contacts').children.length===2);$('creator-show-ceo').checked=false;$('creator-show-coffee').checked=false;await save();assert($('creator-ceo').hidden&&$('about-coffee').hidden,'No ocultó secciones');});
await check('editar correo y agregar otro número',async()=>{const email=$('creator-info-contacts').querySelector('[data-kind=email] input');email.value='new-contact@fixture.invalid';$('creator-add-whatsapp').click();const phones=$('creator-info-contacts').querySelectorAll('[data-kind=whatsapp] input');phones[1].value='+504 9999-1111';await save();assert(row.info.contacts.length===3&&$('creator-contact-list').textContent.includes('new-contact@fixture.invalid'),'No publicó contactos');});
await check('ocultar Business contact no publica sus valores',async()=>{$('creator-show-contact').checked=false;await save();assert($('creator-business-contact').hidden,'Contacto visible');assert((await client.creatorInfo()).info.contacts.length===0,'Contacto oculto expuesto');assert((await client.creatorSettings()).info.contacts.length===3,'Perdió configuración privada');});
await check('error de nube conserva edición sin aparentar publicación',async()=>{fail=true;$('creator-info-contacts').querySelector('input').value='pending@fixture.invalid';await save();assert($('creator-info-status').textContent.includes('límite de uso'),'Error incorrecto');assert(!row.info.contacts.some(c=>c.value==='pending@fixture.invalid'),'Guardado ficticio');assert($('creator-info-contacts').querySelector('input').value==='pending@fixture.invalid','Borró edición');fail=false;});
await check('conflicto conserva borrador y recargar restaura versión publicada',async()=>{conflict=true;await save();assert($('creator-info-status').textContent.includes('Tu borrador se conserva'),'No informó conflicto');conflict=false;$('creator-info-reload').click();await wait(()=>$('creator-info-status').textContent.includes('Sólo tú'));assert($('creator-info-contacts').querySelector('input').value==='new-contact@fixture.invalid','No recargó');});
await check('X inmóvil al desplazar; cierre accesible',async()=>{const content=about.querySelector('.about-content');content.scrollTop=0;await new Promise(requestAnimationFrame);const top=$('close-about').getBoundingClientRect().top;content.scrollTop=content.scrollHeight;await new Promise(requestAnimationFrame);assert(content.scrollTop>0,'No se probó desplazamiento');assert(Math.abs($('close-about').getBoundingClientRect().top-top)<1,'Se movió la X');assert(about.scrollTop===0,'Se desplaza el diálogo exterior');$('close-about').click();assert(!about.open,'No cerró');about.showModal();});
about.querySelector('.about-content').scrollTop=0;$('result').textContent=passed+' pruebas aprobadas · '+failed+' fallidas · Datos ficticios';$('result').dataset.failed=String(failed>0);
</script>
