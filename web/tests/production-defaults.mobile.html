<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Valores fijos · móvil</title><style>body{margin:0;background:#080d15;color:white;font:13px system-ui;display:grid;justify-content:center}iframe{width:390px;height:844px;border:0}p{max-width:390px}</style><p id="status">Comprobando…</p><iframe src="production-defaults.browser.html" title="Valores mensuales móvil"></iframe><script>const f=document.querySelector('iframe');f.onload=()=>{let n=0;const timer=setInterval(()=>{const d=f.contentDocument;if(d.documentElement.dataset.qa==='fail'||++n>60){document.querySelector('#status').textContent='FAIL';clearInterval(timer);}else if(d.documentElement.dataset.qa==='pass'){const dialog=d.querySelector('.prod-defaults-dialog'),r=dialog.getBoundingClientRect(),b=[...dialog.querySelectorAll('button')].find(b=>b.textContent==='Guardar valores fijos').getBoundingClientRect(),ok=r.left>=0&&r.right<=390&&r.bottom<=844&&b.bottom<=r.bottom;document.querySelector('#status').textContent=(ok?'PASS':'FAIL')+' · 390×844 · diálogo y botón Guardar visibles · '+d.querySelector('#qa-status').textContent;clearInterval(timer);}},100)};</script></html>
