<!doctype html><html lang="es" data-theme="winter"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proporciones de equipos</title><link rel="stylesheet" href="../public/styles.css"><link rel="stylesheet" href="../public/premium.css"><link rel="stylesheet" href="../public/team-carousel.css"><body><main id="app" class="app">    <header class="app-header" id="app-header">
      <div class="brand" aria-label="SuperTools Herramientas para equipos y administración">
        <span class="brand-emblem" aria-hidden="true"><img src="../public/brand/supertools-symbol.dde519ee1d6b5bbf.png" width="64" height="64" alt=""></span>
        <div class="brand-copy">
          <p class="brand-name">SuperTools</p>
          <p class="brand-sub">Herramientas para equipos y administración</p>
        </div>
      </div>
<button class="admin-entry" id="open-admin-dashboard" type="button" aria-label="Abrir panel de administrador" hidden>Admin<span id="admin-unread" class="admin-unread" hidden></span></button>
      <span class="sync-indicator" id="sync-indicator" role="status" aria-live="polite" aria-label="Sincronizando equipos" title="Sincronizando equipos" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M19 12a7 7 0 0 0-12-5L4 10m1 2a7 7 0 0 0 12 5l3-3"/></svg></span>
      <button class="about-button" id="open-web-settings" type="button" aria-haspopup="dialog" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m9 3-.6 2.5-2.2 1.3L3.8 6 2 9l1.8 1.8v2.4L2 15l1.8 3 2.4-.8 2.2 1.3L9 21h6l.6-2.5 2.2-1.3 2.4.8 1.8-3-1.8-1.8v-2.4L22 9l-1.8-3-2.4.8-2.2-1.3L15 3Z"/><circle cx="12" cy="12" r="3.2"/></svg></button>
      <button class="about-button" id="open-board" type="button" aria-haspopup="dialog" aria-label="Pizarra corporativa" title="Pizarra corporativa"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M8 3v4m8-4v4M8 11h8m-8 4h5"/></svg></button>
      <button class="about-button" id="open-about" type="button" aria-haspopup="dialog" aria-label="Acerca de SuperTools">ⓘ</button>
    </header>    <section class="teams-screen" id="teams-screen" aria-labelledby="profiles-title" tabindex="-1">
      <div class="plant-navigation">
        <button class="back-button" id="back-to-plants" type="button">← Plantas</button><span id="selected-plant-label" hidden>Sacos</span>
        <button id="teams-iso-calendar-open" class="iso-calendar-card" type="button" aria-label="Abrir calendario ISO" hidden><span class="iso-calendar-copy"><strong id="teams-iso-current-week">Semana —</strong><time id="teams-iso-current-date"></time></span></button>
        <button id="plant-clock" class="plant-clock" type="button" aria-label="Hora actual. Toca para cambiar el formato." aria-pressed="false" hidden>
          <span id="plant-day-icon" class="plant-clock-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></span>
          <span id="plant-night-icon" class="plant-clock-icon" aria-hidden="true" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20.4 14.2A8.7 8.7 0 0 1 9.8 3.6a8.8 8.8 0 1 0 10.6 10.6Z"/></svg></span>
          <time id="plant-current-time">--:--</time>
        </button>
      </div>
      <p id="plant-clock-status" class="hint" role="status" hidden></p>
      <div class="teams-intro">

        <h1 id="profiles-title">Tus equipos</h1>
        <p class="teams-copy">Tu equipo, tus herramientas.</p>
      </div>

      <p class="plant-empty" id="plant-empty" hidden>Esta planta aún no tiene equipos. Pulsa + para crear el primero.</p>
      <div class="profile-grid" id="profile-list" role="radiogroup" aria-label="Elegir equipo"></div>

      <p class="profiles-notice" id="profiles-notice" role="note" hidden></p>
      <button class="button button-primary add-team-button" id="add-team" type="button" aria-label="Agregar equipo" title="Agregar equipo"><svg viewBox="0 0 72 72" aria-hidden="true"><defs><mask id="add-team-plus-cutout" maskUnits="userSpaceOnUse" x="0" y="0" width="72" height="72"><circle cx="36" cy="36" r="34" fill="white"/><path d="M36 18v36M18 36h36" fill="none" stroke="black" stroke-width="10" stroke-linecap="round"/></mask></defs><circle cx="36" cy="36" r="34" fill="currentColor" fill-opacity="0.62" mask="url(#add-team-plus-cutout)"/></svg></button>
    </section>

</main><output id="carousel-result" hidden></output><button id="carousel-reset" hidden></button><output id="team-screen-result" hidden></output><script type="module" src="./team-screen.fixture.js"></script></body></html>
