<!doctype html><html lang="es" data-theme="ice"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Adjunto de ideas · prueba aislada</title>
<link rel="stylesheet" href="../public/styles.css"><link rel="stylesheet" href="../public/premium.css">
<style>#result{position:fixed;bottom:0;left:0;right:0;z-index:9000;padding:10px;background:#123627;color:white;font:13px system-ui}#result[data-failed=true]{background:#652323}</style>
<aside id="result" role="status">Ejecutando…</aside>
<script type="module">
import {createCloudWorkspace} from '../public/cloud-workspace.js';
import {PROFILE_CATALOG} from '../public/profiles.js';
import {appendIdeaAttachment,isIdeaImage} from '../public/idea-attachment.js';
const parsed=new DOMParser().parseFromString(await(await fetch('../public/index.html')).text(),'text/html');for(const s of parsed.querySelectorAll('script'))s.remove();for(const img of parsed.querySelectorAll('img[src^="./"]'))img.src='../public/'+img.getAttribute('src').slice(2);for(const child of [...parsed.body.children])document.body.append(child);
const $=id=>document.getElementById(id),assert=(ok,msg)=>{if(!ok)throw Error(msg);},wait=async fn=>{for(let i=0;i<300;i++){if(fn())return;await new Promise(r=>setTimeout(r,10));}throw Error('Tiempo agotado');};
let passed=0,failed=0,mode='preview',calls=[],failSend=false,failWrite=false,reads=0,team='champions';
const values=new Map(),storage={getText:async k=>values.get(k)||null,putText:async(k,v)=>{if(failWrite&&k.startsWith('mn1.idea.pic.'))throw Error('Almacén no disponible');values.set(k,v);}};
const canvas=document.createElement('canvas');canvas.width=640;canvas.height=280;const ctx=canvas.getContext('2d');ctx.fillStyle='#0c2138';ctx.fillRect(0,0,640,280);ctx.fillStyle='#8de4f3';ctx.font='bold 28px sans-serif';ctx.fillText('Ejemplo de mejora',30,50);for(let i=0;i<4;i++){ctx.fillStyle=['#7ce7b1','#96dfff','#ffb85e','#df94ef'][i];ctx.fillRect(30,85+i*40,450-i*70,20);}const png=canvas.toDataURL('image/png');
const file=new File([await(await fetch(png)).blob()],'ejemplo.png',{type:'image/png'});
const client={creatorProfile:async()=>[],submitIdea:async(...args)=>{calls.push(args);if(failSend)throw Error('Sin conexión de prueba');},myIdeas:async()=>[{id:'fixture',team_name:'Equipo ficticio',plant_id:'sacos',note:'Una propuesta ficticia con referencia visual',status:'pending',has_attachment:true,created_at:new Date().toISOString()}],ideaImage:async(id,receipt)=>{reads++;assert(receipt===values.get('mn1.idea.client'),'Recibo incorrecto');return png;}};
const cloud=createCloudWorkspace(()=>({mode,bridge:{request:async()=>({ok:true,data:{imageDataUrl:png}})},catalog:PROFILE_CATALOG,activeProfileId:team,storage}),{client});
const open=async()=>{$('open-ideas').click();await wait(()=>$('ideas-dialog').open&&!$('idea-send').disabled);};
const close=async()=>{const d=$('ideas-dialog');if(d.open)await new Promise(resolve=>{d.addEventListener('close',resolve,{once:true});d.close();});};
const choose=async()=>{const dt=new DataTransfer();dt.items.add(file);$('idea-image-input').files=dt.files;$('idea-image-input').dispatchEvent(new Event('change'));await wait(()=>!$('idea-send').disabled);};
async function check(name,fn){try{await fn();passed++;console.log('PASS '+name);}catch(e){failed++;console.error('FAIL '+name+': '+e.message);}}
await check('adjuntar muestra preview y conserva borrador al reabrir',async()=>{await open();$('idea-note').value='Me gustaría una herramienta con una gráfica como esta.';await choose();assert(!$('idea-image-preview').hidden,'Falta preview');assert(isIdeaImage(values.get('mn1.idea.pic.champions')),'No guardó copia');await close();await open();assert(!$('idea-image-preview').hidden&&$('idea-note').value.includes('gráfica'),'Perdió borrador: texto='+$('idea-note').value+' guardado='+values.get('mn1.idea.draft.champions'));});
await check('cambiar equipo no mezcla adjuntos',async()=>{await close();team='espartanos';await open();assert($('idea-image-preview').hidden,'Imagen de otro equipo');await close();team='champions';await open();assert(!$('idea-image-preview').hidden,'Perdió imagen de Champions');});
await check('fallo de almacenamiento conserva imagen anterior',async()=>{const previous=$('idea-image-preview').src;failWrite=true;await choose();failWrite=false;assert($('idea-image-preview').src===previous,'Reemplazó imagen tras error');});
await check('fallo de envío conserva texto e imagen y reutiliza id',async()=>{failSend=true;$('idea-send').click();await wait(()=>calls.length===1&&!$('idea-send').disabled);assert(!$('idea-image-preview').hidden&&$('idea-note').value,'Perdió borrador');failSend=false;$('idea-send').click();await wait(()=>calls.length===2&&!$('idea-send').disabled);assert(calls[0][0]===calls[1][0]&&calls[1][4],'No reintentó mismo payload/id');assert($('idea-image-preview').hidden&&!$('idea-note').value,'No limpió tras enviar');});
await check('imagen enviada disponible sólo bajo demanda en Mis solicitudes',async()=>{$('my-ideas-open').click();await wait(()=>$('my-ideas-list').children.length>0);assert(reads===0,'Descarga anticipada');const d=$('my-ideas-list').querySelector('details');d.open=true;await wait(()=>reads===1&&d.querySelector('img'));assert(d.querySelector('img').src===png,'Imagen incorrecta');await close();});
await check('Android utiliza IMPORT_IMAGE sin cambiar la APK',async()=>{mode='native';await open();$('idea-image-add').click();await wait(()=>!$('idea-send').disabled&&!$('idea-image-preview').hidden);assert(isIdeaImage(values.get('mn1.idea.pic.champions')),'No preparó el PNG nativo');});
await check('quitar imagen conserva texto',async()=>{$('idea-note').value='Este texto debe quedarse.';$('idea-image-remove').click();await wait(()=>!$('idea-send').disabled);assert($('idea-image-preview').hidden&&$('idea-note').value==='Este texto debe quedarse.','Quitó el texto');});
await check('admin obtiene adjunto sin recibo; reintento de lectura',async()=>{let n=0;const host=document.createElement('div');document.body.append(host);appendIdeaAttachment(host,{id:'sample',team_name:'Equipo ficticio',has_attachment:true},{client:{ideaImage:async(id,receipt)=>{assert(receipt===null,'Recibo ajeno');if(++n===1)throw Error();return png;}}});const d=host.querySelector('details');d.open=true;await wait(()=>d.textContent.includes('No se pudo'));d.open=false;await new Promise(r=>setTimeout(r,10));d.open=true;await wait(()=>d.querySelector('img'));host.remove();});
if(new URLSearchParams(location.search).has('empty')){$('idea-note').value='';$('ideas-status').textContent='';}else{await choose();$('idea-note').value='Me gustaría poder adjuntar una referencia visual para explicar una nueva herramienta.';}$('result').textContent=passed+' pruebas aprobadas · '+failed+' fallidas · Datos ficticios, sin envío real';$('result').dataset.failed=String(failed>0);
</script>
