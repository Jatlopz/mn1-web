<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SuperTools · prueba móvil</title><style>body{margin:0;background:#080d15;color:white;font:14px system-ui;display:grid;justify-content:center}iframe{width:390px;height:844px;border:0}p{max-width:390px}</style><p id="mobile-status">Comprobando vista móvil…</p><iframe src="production-order-chart.browser.html" title="SuperTools móvil"></iframe><script>const f=document.querySelector('iframe');f.onload=()=>{let tries=0;const timer=setInterval(()=>{const d=f.contentDocument;if(d.documentElement.dataset.qa==='fail'||++tries>50){document.getElementById('mobile-status').textContent='FAIL';clearInterval(timer);}else if(d.documentElement.dataset.qa==='pass'){const chart=d.querySelector('.prod-chart');chart.scrollIntoView({block:'start'});const rect=chart.getBoundingClientRect(),ok=rect.width<=390&&rect.left>=0&&rect.right<=390&&rect.bottom<=844;document.getElementById('mobile-status').textContent=(ok?'PASS':'FAIL')+' · vista 390 × 844 · gráfica completa visible al desplazar hasta ella · '+d.querySelector('#qa-result').textContent;clearInterval(timer);}},100)};</script></html>
