// Two independent vaults and one shared dashboard, as on two supervisors' devices.
let published=null,writes=0,online=true;
async function client(isOwner,teamId){
 const frame=document.createElement('iframe');document.body.append(frame);const doc=frame.contentDocument;

 const sharing={read:async()=>({canPublish:isOwner,item:structuredClone(published)}),publish:async(t,day,rev,payload)=>{

 }};

 const click=name=>[...doc.querySelectorAll('button')].find(b=>b.textContent===name).click();

}
