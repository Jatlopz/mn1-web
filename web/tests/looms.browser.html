<!doctype html><html lang="es" data-theme="halloween"><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; img-src 'self' data:; style-src 'self' 'unsafe-inline'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Telares · prueba con datos ficticios</title><link rel="stylesheet" href="../public/styles.css"><link rel="stylesheet" href="../public/looms.css"><link rel="stylesheet" href="../public/premium.css"><p id="qa" style="position:fixed;top:0;left:0;background:#092234;color:white;z-index:9999;padding:5px;font:12px system-ui"></p><script type="module">
import {createLoomStudio} from '../public/looms-studio.js';
import {loomConfigKey,loomWeekKey,createLoomWeek} from '../public/looms-model.js';
const team={id:'qa-looms',name:'Equipo ficticio de Telares',plantId:'sacos'},data=new Map();let fail=false,admin=true;
data.set(loomConfigKey(team.id),JSON.stringify({version:1,people:[{id:'person-a',name:'Operador de ejemplo',enabled:true},{id:'person-b',name:'Operadora de ejemplo',enabled:true}],benches:[{id:'bench-a',name:'Bancada A',enabled:true}],machines:[{id:'loom-a',name:'Telar de ejemplo 1',baseTarget:'1200',benchId:'bench-a',enabled:true},{id:'loom-b',name:'Telar de ejemplo 2',baseTarget:'1800',benchId:'bench-a',enabled:true}]}));
const w=createLoomWeek('2026-11-04');w.schedule=[{benchId:'bench-a',shift:'TA',personId:'person-a'}];data.set(loomWeekKey(team.id,'2026-11-04'),JSON.stringify(w));
const studio=createLoomStudio(()=>({storage:{getText:async k=>data.get(k)??null,putText:async(k,v)=>{if(fail)throw Error('Fallo de guardado simulado');data.set(k,v);}},canConfigure:()=>admin,getRegistry:async()=>({version:1,plantId:'sacos',revision:0,processes:[{id:'11111111-1111-4111-8111-111111111111',code:'telares',name:'Telares',flow:'entry',cycle:'permanent',defaultKind:'machine',enabled:true,ordinal:1,resources:[{id:'22222222-2222-4222-8222-222222222222',name:'Telar de catálogo ficticio',kind:'machine',enabled:true,ordinal:1}]}]})}),{now:()=>new Date(2026,10,4)});
const pause=()=>new Promise(r=>setTimeout(r,40)),root=document.getElementById('looms-studio'),button=name=>[...root.querySelectorAll('button')].find(b=>b.textContent===name),input=label=>[...root.querySelectorAll('label')].find(l=>l.firstChild?.textContent===label)?.querySelector('input,select'),set=(label,value)=>{const i=input(label);if(!i)throw Error('Campo no encontrado '+label);i.value=value;i.dispatchEvent(new Event(i.tagName==='SELECT'?'change':'input',{bubbles:true}));};let count=0;const check=(condition,message)=>{if(!condition)throw Error(message);count++;};
root.prepend(document.getElementById('qa'));
try{
await studio.open(team);check(root.open,'Abre');button('Captura').click();await pause();check(input('Horas de Telar de ejemplo 1').value==='12','12 horas iniciales');check(input('Responsable de Telar de ejemplo 1').value==='person-a','Responsable semanal');set('Real de Telar de ejemplo 1','600');set('Horas de Telar de ejemplo 1','6');set('Real de Telar de ejemplo 2','900');set('Horas de Telar de ejemplo 2','6');check([...root.querySelectorAll('output')].every(o=>o.textContent==='100 %'),'Meta proporcional');
fail=true;button('Guardar cambios').click();await pause();check(root.textContent.includes('Fallo de guardado simulado'),'Fallo visible');check(JSON.parse(data.get(loomWeekKey(team.id,'2026-11-04'))).captures.length===0,'No borra captura anterior');check(input('Real de Telar de ejemplo 1').value==='600','No pierde entrada');fail=false;button('Guardar cambios').click();await pause();check(JSON.parse(data.get(loomWeekKey(team.id,'2026-11-04'))).captures.length===2,'Guarda dos capturas');button('Dashboard').click();await pause();check(root.querySelector('.looms-kpi strong').textContent==='100 %','Dashboard ponderado');check(root.querySelectorAll('[role=meter]').length===2,'Gráficas de persona y día');
await studio.close();await studio.open(team);button('Captura').click();await pause();check(input('Real de Telar de ejemplo 1').value==='600','Persiste al reabrir');await studio.close();admin=false;await studio.open(team);check(button('Configuración').hidden,'Configuración sólo admin');await studio.close();admin=true;await studio.open(team);button('Configuración').click();await pause();set('Nombre de la persona','Persona renombrada');button('Guardar cambios').click();await pause();button('Importar máquinas de Telares').click();await pause();check(JSON.parse(data.get(loomConfigKey(team.id))).machines.length===3,'Importa después de guardar configuración');check([...data.keys()].some(k=>k.startsWith('mn1.loom.history.')),'Conserva respaldos');set('Bancada de Telar de catálogo ficticio','bench-a');button('Guardar cambios').click();await pause();set('Nombre de la persona','Edición temporal');admin=false;check(await studio.close()===false,'No escribe catálogo sin permiso');check(!button('Cerrar sin guardar').hidden,'Salida segura disponible');button('Cerrar sin guardar').click();await pause();[...document.querySelectorAll('button')].find(b=>b.textContent==='Descartar edición y cerrar').click();check(!root.open,'Puede salir tras perder sesión');admin=true;data.set(loomConfigKey('broken'),'{');check(await studio.open({...team,id:'broken'})===false,'No sustituye configuración corrupta');check(await studio.close()===true,'Puede cerrar error');admin=true;await studio.open(team);check(!button('Captura').disabled,'Controles recuperados tras error');button('Captura').click();await pause();set('Horas de Telar de catálogo ficticio','7');set('Responsable de Telar de catálogo ficticio','');button('Guardar cambios').click();await pause();button('Asignaciones').click();await pause();set('TA · Bancada A','person-b');button('Guardar cambios').click();await pause();button('Captura').click();await pause();check(input('Horas de Telar de catálogo ficticio').value==='7','Pendiente conserva horas');check(input('Responsable de Telar de catálogo ficticio').value==='person-b','Pendiente recibe asignación semanal posterior');check(input('Responsable de Telar de ejemplo 1').value==='person-a','Confirmado conserva responsable');button('Dashboard').click();await pause();

const portrait=document.createElement('canvas');portrait.width=256;portrait.height=256;const ctx=portrait.getContext('2d');ctx.fillStyle='#1e5078';ctx.fillRect(0,0,256,256);ctx.fillStyle='#b4d5ef';ctx.beginPath();ctx.arc(128,98,48,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(128,244,91,80,0,0,Math.PI*2);ctx.fill();const sample=portrait.toDataURL('image/jpeg',.85);const photoFile=new File([Uint8Array.from(atob(sample.split(',')[1]),c=>c.charCodeAt(0))],'operador-ficticio.jpg',{type:'image/jpeg'});
async function choosePhoto(){const picker=root.querySelector('input[type=file]'),transfer=new DataTransfer();transfer.items.add(photoFile);picker.files=transfer.files;picker.dispatchEvent(new Event('change',{bubbles:true}));for(let i=0;i<100&&root.getAttribute('aria-busy')==='true';i++)await pause();check(root.getAttribute('aria-busy')==='false','Termina foto');}
button('Configuración').click();await pause();fail=true;await choosePhoto();check(!JSON.parse(data.get(loomConfigKey(team.id))).people[0].photoKey,'Fallo de imagen conserva foto anterior');fail=false;await choosePhoto();check(!JSON.parse(data.get(loomConfigKey(team.id))).people[0].photoKey,'Foto espera guardar configuración');button('Guardar cambios').click();await pause();const savedPhotoKey=JSON.parse(data.get(loomConfigKey(team.id))).people[0].photoKey;check(savedPhotoKey?.startsWith('mn1.loom.pic.'),'Referencia local de foto guardada');check(data.get(savedPhotoKey)?.startsWith('data:image/jpeg;base64,'),'Foto JPEG local');button('Dashboard').click();await pause();check(root.querySelector('.looms-chart-person img')?.getAttribute('src').startsWith('data:image/jpeg;base64,'),'Foto junto a gráfica de persona');await studio.close();admin=false;await studio.open(team);check(Boolean(root.querySelector('.looms-chart-person img')),'Foto persiste al reabrir');check(!root.querySelector('.looms-avatar-button'),'Usuario sin edición de foto');await studio.close();admin=true;await studio.open(team);button('Configuración').click();await pause();button('Quitar foto').click();button('Guardar cambios').click();await pause();check(JSON.parse(data.get(loomConfigKey(team.id))).people[0].photoKey==='','Quita referencia');check(data.has(savedPhotoKey),'Conserva imagen anterior para respaldo');await choosePhoto();button('Guardar cambios').click();await pause();check(Boolean(JSON.parse(data.get(loomConfigKey(team.id))).people[0].photoKey),'Reemplazo tras guardar usa catálogo vigente');button('Dashboard').click();await pause();check(Boolean(root.querySelector('.looms-chart-person img')),'Foto vuelve a la gráfica después de quitar y agregar');
document.getElementById('qa').textContent='PASS · '+count+' pruebas de captura, dashboard, guardado y conservación';document.documentElement.dataset.qa='pass';
}catch(e){document.getElementById('qa').textContent='FAIL · '+e.message;document.documentElement.dataset.qa='fail';}
</script></html>
