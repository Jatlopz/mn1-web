<!doctype html><html lang="es" data-theme="halloween"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SuperTools · fondos panorámicos UHD</title><link rel="stylesheet" href="../public/styles.css"><link rel="stylesheet" href="../public/production.css"><link rel="stylesheet" href="../public/premium.css"><style>.scene-preview{max-width:1100px;margin:0 auto;padding:32px 24px;position:relative;z-index:1}.scene-preview header{display:flex;gap:24px;align-items:center;justify-content:space-between}.scene-preview header h1{font-size:2rem;letter-spacing:-.04em}.scene-preview nav{display:flex;gap:8px;flex-wrap:wrap;margin:24px 0}.scene-preview nav button{border:0;border-radius:12px;padding:12px;color:var(--text);background:var(--panel-glass);cursor:pointer;font:inherit}.scene-preview nav [aria-pressed=true]{color:var(--lime);box-shadow:inset 0 -2px var(--lime)}.scene-preview section{margin-top:18vh;max-width:620px}.scene-preview section h2{font-size:clamp(2rem,4vw,3.6rem);line-height:1.1;letter-spacing:-.04em}.scene-preview section p{font-size:1.1rem;line-height:1.6}.scene-preview .proof{padding:16px 0;color:var(--text-muted);font-size:.8rem}.scene-preview .sample-tools{display:flex;gap:18px;margin-top:24px}.sample-tools button{border:0;border-radius:14px;background:var(--panel-glass);color:var(--text);padding:20px;font:inherit}.scroll-proof{height:70vh;position:relative;z-index:1}.scene-preview footer{margin-top:40px;font-size:.8rem;color:var(--text-muted)}</style>
<main class="scene-preview"><header><h1>SuperTools</h1><span>Vista de escritorio</span></header><nav aria-label="Fondos de temporada"></nav><section><p>HERRAMIENTAS PARA EQUIPOS</p><h2>Tu equipo,<br>tus herramientas.</h2><p>Fondos panorámicos que se adaptan a toda la ventana, con tus cuadros y transparencias habituales.</p><div class="sample-tools"><button>📣 Anuncios</button><button>▥ Producción</button></div></section><p class="proof" role="status">Comprobando fondo…</p><footer>Vista previa de fondos · sin cambios en datos o preferencias.</footer></main><div class="scroll-proof"></div><script type="module">
const choices=[['Halloween','halloween','original','aurora'],['Luna y murciélagos','halloween','moon','aurora'],['Aurora','winter','original','aurora'],['Navidad dorada','winter','original','gold'],['Navidad nevada','winter','original','snow']];
let revision=0;const nav=document.querySelector('nav'),status=document.querySelector('[role=status]');
function choose(index){const [,theme,wallpaper,winter]=choices[index];Object.assign(document.documentElement.dataset,{theme,wallpaper,winterWallpaper:winter});for(const b of nav.children)b.setAttribute('aria-pressed',String(Number(b.dataset.index)===index));void check();}
for(const [index,c]of choices.entries()){const b=document.createElement('button');b.textContent=c[0];b.dataset.index=index;b.addEventListener('click',()=>choose(index));nav.append(b);}
async function check(){const current=++revision,style=getComputedStyle(document.body,'::before'),url=style.backgroundImage.match(/url\(["']?(.*?)["']?\)/)?.[1];if(!url)return;const img=new Image();img.src=url;await img.decode();if(current!==revision)return;const desktop=matchMedia('(min-width:1000px) and (min-aspect-ratio:1/1)').matches;const ok=img.naturalWidth===(desktop?3840:1024)&&img.naturalHeight===(desktop?2160:1536)&&style.backgroundSize==='cover'&&style.position==='fixed'&&style.backgroundRepeat==='no-repeat';status.textContent=(ok?'PASS':'FAIL')+' · '+img.naturalWidth+' × '+img.naturalHeight+' · '+(desktop?'panorámico UHD':'original vertical')+' · fondo fijo, sin deformación ni repetición';document.documentElement.dataset.qa=ok?'pass':'fail';}
let resize;addEventListener('resize',()=>{clearTimeout(resize);resize=setTimeout(()=>void check(),120);});choose(Number(new URLSearchParams(location.search).get('scene'))||0);
</script></html>
