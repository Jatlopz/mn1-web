<!doctype html><html lang="es"><meta charset="utf-8"><title>Fondos · matriz responsive</title><style>body{background:#101621;color:#eef4ff;font:16px system-ui;padding:20px}article{display:inline-block;vertical-align:top;margin:12px}iframe{border:0;transform-origin:top left}.frame{overflow:hidden}p{max-width:440px}</style><h1>Verificación responsive</h1><main></main><script>
const sizes=[[3840,2160],[1920,1080],[3440,1440],[390,844],[1000,1400]];
for(const [w,h]of sizes){const a=document.createElement('article'),p=document.createElement('p'),box=document.createElement('div'),f=document.createElement('iframe'),scale=Math.min(440/w,360/h);p.textContent=w+' × '+h+' · comprobando';box.className='frame';box.style.cssText=`width:${w*scale}px;height:${h*scale}px`;f.width=w;f.height=h;f.style.transform=`scale(${scale})`;f.src='desktop-backgrounds.browser.html?scene='+(new URLSearchParams(location.search).get('scene')||0);f.onload=()=>{const timer=setInterval(()=>{const s=f.contentDocument.querySelector('[role=status]');if(s&&/PASS|FAIL/.test(s.textContent)){p.textContent=w+' × '+h+' · '+s.textContent;clearInterval(timer)}},150)};box.append(f);a.append(p,box);document.querySelector('main').append(a)}
</script></html>
