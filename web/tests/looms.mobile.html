<!doctype html><html lang="es"><meta charset="utf-8"><title>Telares · vista móvil</title><style>body{margin:0;background:#07121e;color:white;font:14px system-ui;display:grid;justify-content:center}iframe{width:390px;height:844px;border:0}p{max-width:390px}</style><p id="result">Comprobando…</p><iframe src="looms.browser.html" title="Telares móvil"></iframe><script>const f=document.querySelector('iframe');f.onload=()=>{let tries=0;const t=setInterval(()=>{const d=f.contentDocument;if(d.documentElement.dataset.qa==='fail'||++tries>100){document.getElementById('result').textContent='FAIL';clearInterval(t);}else if(d.documentElement.dataset.qa==='pass'){const r=d.getElementById('looms-studio').getBoundingClientRect();document.getElementById('result').textContent=(r.left>=0&&r.right<=390&&r.top>=0&&r.bottom<=844?'PASS':'FAIL')+' · diálogo dentro de 390 × 844 · '+d.getElementById('qa').textContent;clearInterval(t);}},100)};</script></html>
