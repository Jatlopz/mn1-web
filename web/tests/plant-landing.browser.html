<!doctype html><html lang="es" data-theme="winter"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Proporciones de plantas</title><link rel="stylesheet" href="../public/styles.css"><link rel="stylesheet" href="../public/premium.css"><link rel="stylesheet" href="../public/team-carousel.css"><body><main id="app" class="app">    <header class="app-header" id="app-header">
      <div class="brand" aria-label="SuperTools Herramientas para equipos y administración">
        <span class="brand-emblem" aria-hidden="true"><img src="../public/brand/supertools-symbol.dde519ee1d6b5bbf.png" width="64" height="64" alt=""></span>
        <div class="brand-copy">
          <p class="brand-name">SuperTools</p>
          <p class="brand-sub">Herramientas para equipos y administración</p>
        </div>
      </div>
<button class="admin-entry" id="open-admin-dashboard" type="button" aria-label="Abrir panel de administrador" hidden>Admin<span id="admin-unread" class="admin-unread" hidden></span></button>
      <span class="sync-indicator" id="sync-indicator" role="status" aria-live="polite" aria-label="Sincronizando equipos" title="Sincronizando equipos" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5M19 12a7 7 0 0 0-12-5L4 10m1 2a7 7 0 0 0 12 5l3-3"/></svg></span>
      <button class="about-button" id="open-web-settings" type="button" aria-haspopup="dialog" aria-label="Settings" title="Settings"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m9 3-.6 2.5-2.2 1.3L3.8 6 2 9l1.8 1.8v2.4L2 15l1.8 3 2.4-.8 2.2 1.3L9 21h6l.6-2.5 2.2-1.3 2.4.8 1.8-3-1.8-1.8v-2.4L22 9l-1.8-3-2.4.8-2.2-1.3L15 3Z"/><circle cx="12" cy="12" r="3.2"/></svg></button>
      <button class="about-button" id="open-board" type="button" aria-haspopup="dialog" aria-label="Pizarra corporativa" title="Pizarra corporativa"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="M8 3v4m8-4v4M8 11h8m-8 4h5"/></svg></button>
      <button class="about-button" id="open-about" type="button" aria-haspopup="dialog" aria-label="Acerca de SuperTools">ⓘ</button>
    </header>    <section class="welcome-screen" id="welcome-screen" aria-labelledby="welcome-title" tabindex="-1">
      <div class="welcome-copy"><p class="welcome-eyebrow">TU TURNO EMPIEZA AQUÍ</p><h1 id="welcome-title">Bienvenido a<br><span>SuperTools</span></h1><p>Selecciona tu planta para continuar.</p></div>
      <div class="plant-grid" role="group" aria-label="Elegir planta">
        <button class="plant-card" type="button" data-plant="sacos"><span class="plant-symbol" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 27V14l8 4v-8l8 4V6h6v21ZM8 22h2m5 0h2m5 0h2M20 6V3h6v3"/></svg></span><span class="plant-caption">PLANTA</span><strong>Sacos</strong><span id="plant-count-sacos" class="plant-count">4 equipos</span><span class="plant-open">Elegir equipos <span aria-hidden="true">↗</span></span></button>
        <button class="plant-card plant-poly" type="button" data-plant="polietileno"><span class="plant-symbol" aria-hidden="true"><svg viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="1.7"><path d="m16 3 11 6v13l-11 7-11-7V9ZM5 9l11 7 11-7M16 16v13M11 6l11 7v12"/></svg></span><span class="plant-caption">PLANTA</span><strong>Polietileno</strong><span id="plant-count-polietileno" class="plant-count">Sin equipos todavía</span><span class="plant-open">Elegir equipos <span aria-hidden="true">↗</span></span></button>
      </div><p class="welcome-footnote">Tus equipos, anuncios y reportes, organizados por planta.</p>
    </section>
</main><output id="layout-result" hidden></output><script type="module" src="./plant-landing.fixture.js"></script></body></html>
