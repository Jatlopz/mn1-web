<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chat SuperTools · prueba aislada</title><link rel="stylesheet" href="../public/ai-agent.css"><link rel="stylesheet" href="../public/ai-chat.css"><div id="app"><div class="settings-options"></div></div><output id="qa" style="position:fixed;z-index:999;bottom:0;font:12px system-ui;background:#123;color:white">Preparando pruebas ficticias</output><script type="module">
import {createAiAgentUI} from '../public/ai-chat.js';
let user='fixture-owner',calls=0,release=null,delayed=null,legacy=false,workspaceCalls=0;const state={messages:[],roots:[{id:'desktop',name:'Escritorio',writeCopies:false}],proposals:[],recipes:[],remoteAllowed:false,model:'fixture'};
const ui=createAiAgentUI({stationOrigin:location.origin,getSession:async()=>({token:'fictitious-token',userId:user}),fetcher:async(url,options={})=>{if(delayed)await delayed;const route=url.split('/').at(-1),data=options.body?JSON.parse(options.body):{};if(route==='health')return Response.json({paired:true,workspace:!legacy});if(route==='workspace')workspaceCalls++;if(route==='message'){calls++;if(data.action==='open_file'){state.proposals.push({id:'proposal',action:'open_file',args:data.args,expiresAt:Date.now()+100000});state.messages.push({role:'assistant',text:'Revisa la acción.',proposal:state.proposals[0]});}else state.messages.push({role:'assistant',operationId:'op1',text:'Encontré un archivo ficticio.',result:{files:[{id:'file1',name:'Reporte ficticio.xlsx',extension:'.xlsx',type:'file',canOpen:true}]}});return Response.json({state:'completed'});}if(route==='recipe'){state.recipes.push({id:'recipe1',name:data.name,action:'search_files',args:{query:'reporte'}});return Response.json({ok:true});}return Response.json(state);}});
const assert=(yes,msg)=>{if(!yes)throw Error(msg);},wait=async(fn)=>{const end=Date.now()+3000;while(!fn()){if(Date.now()>end)throw Error('Tiempo agotado');await new Promise(r=>setTimeout(r,10));}},root=document.querySelector('#ai-chat'),btn=text=>[...root.querySelectorAll('button')].find(b=>b.textContent===text);let passed=0,failed=0;async function test(name,fn){try{await fn();passed++;}catch(e){failed++;console.error(name,e);}}
await test('chat principal y controles con nombre',async()=>{await ui.open();assert(root.textContent.includes('¿En qué trabajamos hoy?'),'Falta bienvenida');assert([...root.querySelectorAll('button')].every(b=>b.textContent||b.getAttribute('aria-label')),'Falta nombre');});
await test('explorar presenta archivos sin JSON técnico',async()=>{btn('Explorar mi Escritorio').click();await wait(()=>!!btn('Revisar'));assert(calls===1,'No consulta');assert(!root.querySelector('pre'),'JSON visible');});
await test('abrir es propuesta no ejecución',async()=>{btn('Abrir').click();await wait(()=>!!btn('Confirmar y ejecutar'));assert(state.proposals.length===1,'No pide confirmación');});
await test('enseñar guarda una operación real y permite repetir',async()=>{btn('Guardar tarea').click();await wait(()=>!!root.querySelector('dialog[open]'));const input=root.querySelector('[aria-label="Nombre de la tarea"]');input.value='Mi búsqueda';[...root.querySelectorAll('dialog button')].find(b=>b.textContent==='Guardar tarea').click();await wait(()=>!!btn('Mi búsqueda'));assert(state.recipes.length===1,'No guarda tarea');});
await test('cambio de cuenta borra borrador y datos',async()=>{const field=root.querySelector('textarea');field.value='privado ficticio';user='fixture-other';window.dispatchEvent(new Event('supertools:identity-changed'));assert(field.value===''&&!root.textContent.includes('Reporte ficticio.xlsx'),'Filtra datos');});
await test('respuesta tardía no restaura datos de otra cuenta',async()=>{user='fixture-owner';delayed=new Promise(r=>release=r);const pending=ui.open();await new Promise(r=>setTimeout(r,20));user='fixture-other';window.dispatchEvent(new Event('supertools:identity-changed'));release();delayed=null;await pending;assert(!root.textContent.includes('Reporte ficticio.xlsx'),'Filtra respuesta tardía');});
await test('envío anterior no borra un nuevo borrador ni modifica su estado',async()=>{user='fixture-owner';await ui.open();delayed=new Promise(r=>release=r);const field=root.querySelector('textarea');field.value='Borrador anterior';root.querySelector('form').requestSubmit();await new Promise(r=>setTimeout(r,20));ui.close();const next=ui.open();field.value='Borrador nuevo';release();delayed=null;await next;await new Promise(r=>setTimeout(r,30));assert(field.value==='Borrador nuevo','Borra el nuevo borrador');assert(!root.querySelector('[role=status]').textContent.includes('cambió'),'Error de la vista anterior');});
await test('sin desborde y restauración de pantalla anterior',async()=>{assert(root.scrollWidth<=root.clientWidth+1,'Desborde');ui.close();assert(document.querySelector('#app').hidden===false,'No vuelve');user='fixture-owner';await ui.open();});
await test('agente anterior no expone acciones incompatibles ni ruta no encontrada',async()=>{ui.close();legacy=true;const before=workspaceCalls;await ui.open();assert(root.querySelector('[role=status]').textContent.includes('actualización del agente pendiente'),'No explica la incompatibilidad');btn('Explorar mi Escritorio').click();await new Promise(r=>setTimeout(r,20));assert(workspaceCalls===before,'Llama una ruta incompatible');assert(!root.textContent.includes('Ruta no encontrada'),'Muestra error técnico');ui.close();legacy=false;await ui.open();});
document.querySelector('#qa').textContent=(failed?'FAIL':'PASS')+' '+passed+'/'+(passed+failed)+' · sólo datos ficticios';
</script></html>
