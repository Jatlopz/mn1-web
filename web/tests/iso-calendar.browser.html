<!doctype html><html lang="es" data-theme="halloween"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Calendario ISO · prueba aislada</title><link rel="stylesheet" href="../public/styles.css"><link rel="stylesheet" href="../public/production.css"><link rel="stylesheet" href="../public/premium.css"><style>#iso-test-result{position:fixed;bottom:0;left:0;right:0;padding:8px;background:#10251c;color:white;z-index:5000;font:12px system-ui}#iso-test-result[data-result=fail]{background:#652323}</style><aside id="iso-test-result" role="status">Ejecutando…</aside><script type="module">
import {installIsoCalendar,CLOCK_FORMAT_KEY} from '../public/iso-calendar.js';
const status=document.getElementById('iso-test-result'),parsed=new DOMParser().parseFromString(await(await fetch('../public/index.html')).text(),'text/html');for(const script of parsed.querySelectorAll('script'))script.remove();for(const child of [...parsed.body.children])document.body.append(child);
for(const id of ['welcome-screen','teams-screen'])document.getElementById(id).hidden=true;document.getElementById('team-tools-home').hidden=false;document.getElementById('team-tools-title').textContent='Equipo de ejemplo';
let clock=new Date(2026,9,25,23,59),passed=0,failed=0,storageFails=false;const clockValues=new Map([[CLOCK_FORMAT_KEY,'24h']]),clockStorage={getText:async key=>clockValues.get(key),putText:async(key,value)=>{if(storageFails)throw Error('No disponible');clockValues.set(key,value);}};const calendar=installIsoCalendar({now:()=>new Date(clock),timers:false,storage:clockStorage});await calendar.ready;
const trigger=document.getElementById('iso-calendar-open'),dialog=document.getElementById('iso-calendar-dialog');
const assert=(ok,message)=>{if(!ok)throw Error(message);};const check=async(name,run)=>{try{await run();passed++;console.log('PASS '+name);}catch(error){failed++;console.error('FAIL '+name+': '+error.message);}};
await check('semana y fecha actual correctas y accesibles',()=>{assert(document.getElementById('iso-current-week').textContent==='Semana 43','Semana incorrecta');assert(document.getElementById('iso-current-date').textContent==='25/octubre/2026','Fecha incorrecta');assert(trigger.getAttribute('aria-label').includes('Semana 43'),'Nombre accesible incompleto');});
await check('el acceso de Equipos crece15% y abre el mismo calendario',()=>{const teams=document.getElementById('teams-screen'),home=document.getElementById('team-tools-home'),second=document.getElementById('teams-iso-calendar-open'),baseWidth=trigger.getBoundingClientRect().width;home.hidden=true;teams.hidden=false;assert(document.getElementById('selected-plant-label').hidden,'Etiqueta de planta visible');assert(!second.hidden&&second.getBoundingClientRect().width>=44,'Acceso no visible o demasiado pequeño');assert(Math.abs(second.getBoundingClientRect().width/baseWidth-1.15)<.01,'Tamaño no corresponde a15%');assert(document.getElementById('teams-iso-current-week').textContent==='Semana 43','Semana distinta en Equipos');assert(second.getAttribute('aria-label')===trigger.getAttribute('aria-label'),'Nombres accesibles distintos');second.click();assert(dialog.open,'No abre desde Equipos');assert(document.querySelectorAll('#iso-calendar-dialog').length===1,'Calendario duplicado');dialog.close();teams.hidden=true;home.hidden=false;});
await check('abre octubre con números ISO y semanas de lunes a domingo',()=>{trigger.click();assert(dialog.open,'No abre');assert(dialog.querySelectorAll('tbody tr').length===5,'Cantidad de semanas incorrecta');assert([...dialog.querySelectorAll('tbody th')].map(th=>th.textContent).join(',')==='40,41,42,43,44','Números incorrectos');assert(dialog.querySelector('[aria-current=date]').dataset.date==='2026-10-25','Falta hoy');});
await check('consulta otra fecha sin cambiar el indicador de la semana actual',()=>{dialog.querySelector('[data-date="2026-10-19"]').click();assert(dialog.querySelector('.iso-selected-date').dateTime==='2026-10-19','No selecciona fecha');assert(document.getElementById('iso-current-date').dateTime==='2026-10-25','Modificó la fecha actual');});
await check('navegación por teclado y Hoy conservan el foco',()=>{dialog.querySelector('[data-date="2026-10-25"]').click();const day=dialog.querySelector('[data-date="2026-10-25"]');day.dispatchEvent(new KeyboardEvent('keydown',{key:'ArrowRight',bubbles:true}));assert(dialog.querySelector('.iso-selected-week').textContent==='Semana 44 · 2026','No cambia de semana');assert(document.activeElement.dataset.date==='2026-10-26','No mantiene foco');[...dialog.querySelectorAll('button')].find(b=>b.textContent==='Hoy').click();assert(dialog.querySelector('.iso-selected-date').dateTime==='2026-10-25','Hoy no vuelve a la fecha actual');});
await check('al volver a primer plano cambia automáticamente de domingo a lunes',()=>{clock=new Date(2026,9,26,0,1);window.dispatchEvent(new Event('focus'));assert(document.getElementById('iso-current-week').textContent==='Semana 44','No actualiza la semana');assert(document.getElementById('iso-current-date').dateTime==='2026-10-26','No actualiza fecha');assert(document.getElementById('teams-iso-current-week').textContent==='Semana 44','No actualiza semana en Equipos');assert(document.getElementById('teams-iso-current-date').dateTime==='2026-10-26','No actualiza fecha en Equipos');});
await check('Año Nuevo muestra el año ISO correcto y el diálogo cabe en pantalla',()=>{dialog.close();clock=new Date(2027,0,1,0,5);calendar.refresh();trigger.click();assert(dialog.querySelector('.iso-selected-week').textContent==='Semana 53 · 2026','Año ISO incorrecto');const r=dialog.getBoundingClientRect();assert(r.height>240&&r.top>=0&&r.bottom<=innerHeight+1,'Ventana recortada');});
await check('el rango extremo de diciembre9999 no rompe la vista',()=>{dialog.close();clock=new Date(9999,11,31,12);calendar.refresh();trigger.click();assert(dialog.querySelector('.iso-selected-date').dateTime==='9999-12-31','No abre el extremo válido');assert(dialog.querySelector('.iso-selected .hint').textContent.includes('10000'),'No muestra el cierre de semana');});
await check('reloj carga formato, cambia con un toque, muestra sol/luna y restaura ante fallo',async()=>{dialog.close();const control=document.getElementById('plant-clock'),value=document.getElementById('plant-current-time');clock=new Date(2026,9,26,15,28);calendar.refresh();assert(value.textContent==='15:28','No carga24h guardado');assert(!document.getElementById('plant-day-icon').hidden,'No muestra sol');control.click();await Promise.resolve();assert(value.textContent==='3:28 PM'&&clockValues.get(CLOCK_FORMAT_KEY)==='12h','No guardaAM/PM');clock=new Date(2026,9,26,18,0);calendar.refresh();assert(!document.getElementById('plant-night-icon').hidden&&document.getElementById('plant-day-icon').hidden,'No cambia a luna');assert(value.textContent==='6:00 PM','Hora nocturna incorrecta');storageFails=true;control.click();await Promise.resolve();assert(value.textContent==='6:00 PM'&&control.getAttribute('aria-pressed')==='false','No restauraformato');assert(!document.getElementById('plant-clock-status').hidden,'Fallo sin aviso');storageFails=false;});
dialog.close();clock=new Date(2026,9,25,12);calendar.refresh();const params=new URLSearchParams(location.search);if(params.has('largeText'))document.documentElement.style.fontSize='200%';if(params.get('view')!=='card')trigger.click();else trigger.scrollIntoView({block:'center'});status.textContent=(failed?'FAIL':'PASS')+' · '+passed+'/9 pruebas de calendario aprobadas';status.dataset.result=failed?'fail':'pass';
</script></html>
